[pytest]
# Основные параметры pytest

# Минимальная версия Python
minversion = 7.0

# Директории для поиска тестов
testpaths = tests

# Скрывать warnings от зависимостей
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Маркеры
markers =
    unit: Unit tests for functions/methods
    integration: Integration tests for endpoints
    e2e: End-to-end tests for scenarios
    fast: Tests that execute quickly
    slow: Tests that take longer to execute
    critical: Tests for critical business logic
    auth: Tests related to authentication
    admin: Tests for admin functionality
    security: Security-related tests

# Coverage
addopts = 
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-config=.coveragerc
    --tb=short
    -v
    --strict-markers
    --disable-warnings

# Timeout для тестов (в секундах)
timeout = 30

# Logging
log_cli = false
log_level = INFO

# Database
# Используем in-memory SQLite для тестов
SQLALCHEMY_DATABASE_URL = sqlite:///:memory:
