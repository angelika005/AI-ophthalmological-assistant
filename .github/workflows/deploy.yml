name: Deployment - Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # Job 1: Verify Release
  # ==========================================
  verify-release:
    name: Verify Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=${{ github.event.inputs.environment }}-$(date +%Y%m%d-%H%M%S)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Verify changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! grep -q "${GITHUB_REF#refs/tags/}" CHANGELOG.md 2>/dev/null; then
            echo "::warning::Version not found in CHANGELOG.md"
          fi

  # ==========================================
  # Job 2: Build & Push Docker Images
  # ==========================================
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: verify-release
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - backend
          - frontend
          - nginx
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ needs.verify-release.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.verify-release.outputs.version }}
            org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:buildcache,mode=max

  # ==========================================
  # Job 3: Deploy to Target Environment
  # ==========================================
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'Production' }}
    runs-on: ubuntu-latest
    needs: [verify-release, build-push]
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://${{ secrets.DEPLOYMENT_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Docker Stack
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          IMAGE_VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
          
          # Deploy using docker-compose (or docker stack deploy for swarm)
          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST \
            'cd /app && docker-compose pull && docker-compose up -d'
          
          # Cleanup
          rm ~/.ssh/deploy_key

      - name: Health Check
        run: |
          sleep 10
          for i in {1..30}; do
            if curl -f https://${{ secrets.DEPLOYMENT_DOMAIN }}/health; then
              echo "Deployment successful"
              exit 0
            fi
            echo "Attempt $i/30 failed, retrying..."
            sleep 5
          done
          echo "Deployment health check failed"
          exit 1

  # ==========================================
  # Job 4: Post-Deployment Verification
  # ==========================================
  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke tests
        run: |
          DOMAIN=${{ secrets.DEPLOYMENT_DOMAIN }}
          
          echo "Testing health endpoint..."
          curl -f https://$DOMAIN/health
          
          echo "Testing API endpoint..."
          curl -f https://$DOMAIN/api/health
          
          echo "All smoke tests passed"

      - name: Create deployment annotation
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: '${{ github.event.inputs.environment || "production" }}',
              auto_merge: false,
              required_contexts: []
            });

      - name: Notify on success
        if: success()
        run: echo "::notice::Deployment to ${{ github.event.inputs.environment || 'production' }} completed successfully"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment verification failed"
          exit 1
